name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (includes the exact-tie property suite)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only. Publishable values; RLS is the real control.
          VITE_SUPABASE_URL: https://qkohesyqyknavriyhlsc.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle size gate
        run: node scripts/check-bundle-size.mjs

      - name: Supabase security-advisor lint (TR §8 item 2's second gate)
        # No-ops with a warning until SUPABASE_DB_URL is set as a repo
        # secret (Project Settings -> Database -> Connection string, URI)
        # — a real credential, not something to invent or commit here.
        # Once set, this runs the same linter behind the dashboard's
        # security advisor against every migration in this PR/push.
        #
        # NOT --fail-on error: the live project has exactly one ERROR-level
        # finding (spatial_ref_sys "RLS Disabled in Public") that cannot be
        # fixed by this app — that table is owned by the postgis extension;
        # ALTER TABLE on it needs a superuser role this project's connection
        # doesn't have (migration 20260901221012 documents the attempt and
        # does the next-best thing, revoking anon/authenticated access to
        # it). A hard --fail-on error would therefore fail forever on a
        # finding nobody here can clear. This step stays visible (full
        # output printed, and the job still fails on a real CLI/connection
        # error) but does not hard-fail the build on lint findings — review
        # the output manually until there's a reliable way to allowlist
        # just that one finding.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set — skipping the security-advisor lint gate. Add it in repo Settings > Secrets to enable."
            exit 0
          fi
          npx supabase db lint --db-url "$SUPABASE_DB_URL" --level error --fail-on none
