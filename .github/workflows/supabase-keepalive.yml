name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC — well inside Supabase's 7-day pause window
  workflow_dispatch: {}      # manual trigger, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive function
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://syfpkmekdhtmuufotwqa.supabase.co/functions/v1/keepalive")
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Keepalive ping failed"
            exit 1
          fi
